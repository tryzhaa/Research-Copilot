# Research Copilot preferences — edit this to change "how we want it".

# Which model ranks and summarizes.
#   ollama    — free, open-weight, runs on this Mac. Get a model with `ollama pull qwen3:4b`.
#               Bigger = better but needs more RAM: qwen3:8b wants ~16 GB, qwen3:14b ~24 GB.
#   anthropic — Claude via the API (paid, needs ANTHROPIC_API_KEY), e.g. model: claude-opus-5-5
#   Hosted open models, fast and with free tiers. Put each key in .env (git-ignored), e.g. GROQ_API_KEY=gsk_...:
#     groq       (GROQ_API_KEY)       e.g. openai/gpt-oss-120b, llama-3.3-70b-versatile — console.groq.com
#     cerebras   (CEREBRAS_API_KEY)   e.g. gpt-oss-120b — cloud.cerebras.ai
#     gemini     (GEMINI_API_KEY)     e.g. gemini-2.5-flash — aistudio.google.com
#     openrouter (OPENROUTER_API_KEY) hundreds of models, some free — openrouter.ai
#     together   (TOGETHER_API_KEY), openai (OPENAI_API_KEY)
#   Model names change; check the provider's model list if one is rejected.
provider: groq
model: openai/gpt-oss-120b
# provider: ollama
# model: qwen3:4b
effort: medium # low | medium | high. On ollama, high turns on the model's thinking: better, much slower.
reasoning_effort: low # hosted reasoning models (gpt-oss, qwen3): scoring papers doesn't need long thinking
request_token_limit:
  7000 # hosted free tiers cap tokens per request/minute (Groq free: 8000, counting the
  # reserved answer); ranking trims abstracts to fit. Remove on paid tiers
context_tokens:
  16000 # how much paper text the model reads when summarizing. On ollama, more needs more RAM
  # (use 8192 on an 8 GB Mac); on free hosted tiers, too much hits per-minute token limits.

# Before searching, the model rewrites your query: 1-5 keywords for the sources (abbreviations expanded,
# filler dropped) and a sentence of intent for similarity and ranking. Falls back to your words on failure.
rewrite_query: true
rewrite_timeout_seconds: 15 # ~1 s on Groq; a local ollama model may need 30+

# Paper sources need no keys, but OpenAlex (most art and social-science papers) rate-limits anonymous
# searches hard. A free key from openalex.org fixes that: add OPENALEX_API_KEY=... to .env.
# Semantic Scholar likewise takes S2_API_KEY.

# Which fields to search, and where. Toggle them on/off in the UI too.
# openalex_field searches a whole OpenAlex field; openalex_subfields narrows to specific subfields
# instead (they may come from different fields). IDs: https://api.openalex.org/fields/<id>
fields:
  ml:
    label: Machine Learning
    arxiv_categories: [cs.LG, cs.AI, cs.CL, cs.CV, stat.ML]
    openalex_field: 17 # Computer Science
    s2_field: Computer Science
  math:
    label: Mathematics
    arxiv_categories: [math.*]
    openalex_field: 26 # Mathematics
    s2_field: Mathematics
  art:
    label: Art & Design # visual art, painting, sketching, music, design
    arxiv_categories: [cs.GR, cs.SD, eess.AS] # graphics, sound, audio/music: the computational side
    openalex_subfields:
      - 1213 # Visual Arts and Performing Arts
      - 1210 # Music
      - 1704 # Computer Graphics and Computer-Aided Design (where most design papers land)
      - 1709 # Human-Computer Interaction (design research, sketching tools)
    s2_field: Art
  social:
    label: Social Sciences # psychology, sociology, geography
    arxiv_categories: [physics.soc-ph, cs.CY, cs.SI] # social physics, computers & society, social networks
    openalex_subfields:
      - 3200 # General Psychology
      - 3202 # Applied Psychology
      - 3203 # Clinical Psychology
      - 3204 # Developmental and Educational Psychology
      - 3205 # Experimental and Cognitive Psychology
      - 3206 # Neuropsychology and Physiological Psychology
      - 3207 # Social Psychology
      - 3312 # Sociology and Political Science
      - 3305 # Geography, Planning and Development
    s2_field: [Psychology, Sociology, Geography]

# Hard filters applied before any LLM call.
filters:
  min_year: 2020
  min_citations: 0
  exclude_keywords: [] # e.g. ["survey", "workshop"]

# Your standing interests — the ranker scores every paper against this.
interests: |
  I care about papers that connect ML, mathematics and art: generative models,
  geometry and topology in learning, mathematical structure in art and music,
  computational creativity. Prefer rigorous work with clear methods.
  Deprioritize incremental benchmark papers.

# What to put first. Order of importance: datasets > has code > CPU-friendly,
# then a blend of relevance and "would impress a recruiter if I built it".
priorities:
  min_relevance: 5 # 0-10. The tiers below only reorder papers at least this relevant; the rest sort after
  tier_order: [datasets, cpu, code] # first wins: evaluated on min_datasets+ named datasets > has code > runs on CPU
  code_first: true # papers with a public repo (Papers with Code / Hugging Face) get the code tier
  require_code: false # true = hide papers without code entirely
  min_datasets: 1 # prefer papers evaluated on at least this many datasets
  prefer_cpu: true # prefer papers you can replicate without a GPU
  weights: # how the 0-10 signals blend inside each tier; missing signals drop out
    relevance: 0.3 # LLM: fit with query + interests
    recruiter: 0.6 # LLM: how impressive an implementation would look
    similarity: 0.3 # embeddings: cosine similarity to query + interests (always available)
    preference: 0.15 # your trained like/dislike model — raise once `python -m scripts.train_preference_model` has run

# How many candidates to pull per source, how many the model reads, how many to show.
candidates_per_source: 15
rank_at_most: 16 # the most-similar candidates the LLM reads. On an 8 GB Mac a 4B model needs ~1-2 min per 8
rank_timeout_seconds: 120 # give up on the LLM after this long and rank by similarity. Use ~600 on ollama
source_timeout_seconds: 25 # skip a paper source that hasn't answered by then (OpenAlex can take 10-50 s)
show_top: 10
eval_sample: 5 # random unshown candidates offered for rating, so the eval isn't only graded on the top 10

# The exact shape of every summary. Markdown; Claude fills it in.
summary_template: |
  ## TL;DR
  One or two sentences.

  ## Problem & motivation

  ## Method / argument
  Key ideas, equations or theoretical framing (for art papers: the thesis and evidence).

  ## Results / findings

  ## Limitations & open questions

  ## Why it matters to me
  Connect to my stated interests.

  ## Key terms
  3–6 terms with one-line definitions.

  ## Build it
  How I'd implement this as a portfolio project: the datasets to use, whether a laptop CPU is
  enough (and what to scale down if not), the minimal version worth shipping in 1–2 weeks,
  and the one result or demo that would impress a recruiter.
