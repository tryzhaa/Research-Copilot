# Research Copilot preferences — edit this to change "how we want it".

# Which model ranks and summarizes.
#   ollama    — free, open-weight, runs on this Mac. Get a model with `ollama pull qwen3:4b`.
#               Bigger = better but needs more RAM: qwen3:8b wants ~16 GB, qwen3:14b ~24 GB.
#   anthropic — Claude via the API (paid, needs ANTHROPIC_API_KEY), e.g. model: claude-opus-5-5
#   Hosted open models, fast and with free tiers. Put each key in .env (git-ignored), e.g. GROQ_API_KEY=gsk_...:
#     groq       (GROQ_API_KEY)       e.g. openai/gpt-oss-120b, llama-3.3-70b-versatile — console.groq.com
#     cerebras   (CEREBRAS_API_KEY)   e.g. gpt-oss-120b — cloud.cerebras.ai
#     gemini     (GEMINI_API_KEY)     e.g. gemini-2.5-flash — aistudio.google.com
#     openrouter (OPENROUTER_API_KEY) hundreds of models, some free — openrouter.ai
#     together   (TOGETHER_API_KEY), openai (OPENAI_API_KEY)
#   Model names change; check the provider's model list if one is rejected.
provider: groq
model: openai/gpt-oss-120b
# provider: ollama
# model: qwen3:4b
effort: medium                # low | medium | high. On ollama, high turns on the model's thinking: better, much slower.
context_tokens: 16000         # how much paper text the model reads when summarizing. On ollama, more needs more RAM
                              # (use 8192 on an 8 GB Mac); on free hosted tiers, too much hits per-minute token limits.

# Which fields to search, and where. Toggle them on/off in the UI too.
fields:
  ml:
    label: Machine Learning
    arxiv_categories: [cs.LG, cs.AI, cs.CL, cs.CV, stat.ML]
    openalex_field: 17 # Computer Science
    s2_field: Computer Science
  math:
    label: Mathematics
    arxiv_categories: [math.*]
    openalex_field: 26 # Mathematics
    s2_field: Mathematics
  art:
    label: Art
    arxiv_categories: [] # little art scholarship on arXiv
    openalex_field: 12 # Arts and Humanities
    s2_field: Art

# Hard filters applied before any LLM call.
filters:
  min_year: 2015
  min_citations: 0
  exclude_keywords: [] # e.g. ["survey", "workshop"]

# Your standing interests — the ranker scores every paper against this.
interests: |
  I care about papers that connect ML, mathematics and art: generative models,
  geometry and topology in learning, mathematical structure in art and music,
  computational creativity. Prefer rigorous work with clear methods.
  Deprioritize incremental benchmark papers.

# What to put first. Order of importance: has code > datasets > CPU-friendly,
# then a blend of relevance and "would impress a recruiter if I built it".
priorities:
  code_first: true            # papers with a public repo (Papers with Code / Hugging Face) rank above the rest
  require_code: false         # true = hide papers without code entirely
  min_datasets: 2             # prefer papers evaluated on at least this many datasets
  prefer_cpu: true            # prefer papers you can replicate without a GPU
  weights:                    # how the 0-10 signals blend inside each tier; missing signals drop out
    relevance: 0.35           # LLM: fit with query + interests
    recruiter: 0.35           # LLM: how impressive an implementation would look
    similarity: 0.3           # embeddings: cosine similarity to query + interests (always available)
    preference: 0.0           # your trained like/dislike model — raise once `python -m scripts.train_preference_model` has run

# How many candidates to pull per source, how many the model reads, how many to show.
candidates_per_source: 15
rank_at_most: 16              # the most-similar candidates the LLM reads. On an 8 GB Mac a 4B model needs ~1-2 min per 8
rank_timeout_seconds: 120     # give up on the LLM after this long and rank by similarity. Use ~600 on ollama
show_top: 10
eval_sample: 5                # random unshown candidates offered for rating, so the eval isn't only graded on the top 10

# The exact shape of every summary. Markdown; Claude fills it in.
summary_template: |
  ## TL;DR
  One or two sentences.

  ## Problem & motivation

  ## Method / argument
  Key ideas, equations or theoretical framing (for art papers: the thesis and evidence).

  ## Results / findings

  ## Limitations & open questions

  ## Why it matters to me
  Connect to my stated interests.

  ## Key terms
  3–6 terms with one-line definitions.

  ## Build it
  How I'd implement this as a portfolio project: the datasets to use, whether a laptop CPU is
  enough (and what to scale down if not), the minimal version worth shipping in 1–2 weeks,
  and the one result or demo that would impress a recruiter.
