name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy copilot/ app.py eval/ scripts/
      - run: pytest --cov=copilot --cov=eval --cov-report=term-missing --junitxml=pytest-report.xml
      - name: Annotate failing tests
        # Turns each failing test into a GitHub annotation, visible on the run page and via the API.
        if: failure()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          esc = lambda s: s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for case in ET.parse("pytest-report.xml").iter("testcase"):
              for bad in [*case.iter("failure"), *case.iter("error")]:
                  tail = "\n".join((bad.text or "").strip().splitlines()[-25:])
                  print(f"::error title={case.get('classname')}.{case.get('name')}::"
                        + esc(f"{bad.get('message') or ''}\n{tail}")[:3000])
          EOF

  eval:
    # A fresh ranking-quality report on every push, from the committed eval/dataset.json.
    # Replays recorded scores: no API keys, no LLM calls.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: data/models
          key: embedding-model-bge-small-en-v1.5
      - run: pip install -r requirements.txt
      - run: python -m eval.run_eval --output eval/latest_results.json --no-log | tee eval/latest_results.md
      - run: cat eval/latest_results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/latest_results.*
