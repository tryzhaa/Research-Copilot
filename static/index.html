<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Copilot</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#000">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <span class="mark">research copilot</span>
    <nav>
      <button data-view="search" class="on">search</button>
      <button data-view="library">library <span id="lib-count"></span></button>
      <button data-view="map">map</button>
    </nav>
  </header>

  <main>
    <section id="view-search">
      <form id="search-form" autocomplete="off">
        <input id="q" placeholder="What are you looking for?" aria-label="Search query" autofocus>
        <div class="controls">
          <div id="fields" class="toggles"></div>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="code-only"><span>code only</span></label>
            <label class="toggle"><input type="checkbox" id="use-s2"><span>semantic scholar</span></label>
          </div>
        </div>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
      <ul id="errors" class="errors"></ul>
      <aside id="results-graph" class="results-graph" hidden>
        <div class="rg-sticky">
          <p id="rg-note" class="map-note"></p>
          <div id="rg" class="map"></div>
          <div id="rg-card" class="map-card" hidden></div>
        </div>
      </aside>
      <ol id="results" class="papers"></ol>
      <section id="trending" class="trending" hidden aria-labelledby="trending-head">
        <p id="trending-head" class="trending-head">trending on hugging face papers <span id="trending-note"></span></p>
        <ol id="trending-list" class="papers"></ol>
      </section>
      <details id="sample" class="sample" hidden>
        <summary>rate 5 random candidates the ranker didn't show <span>· keeps the eval honest</span></summary>
        <ol id="sample-list" class="papers"></ol>
      </details>
    </section>

    <section id="view-library" hidden>
      <div class="lib-head">
        <div class="toggles" id="lib-filter" role="radiogroup">
          <button data-filter="saved" class="on">saved</button>
          <button data-filter="liked">liked</button>
          <button data-filter="summarized">summarized</button>
        </div>
        <button id="export-bib" class="quiet">export .bib</button>
      </div>
      <p id="lib-where" hidden></p>
      <div id="lib-folders" class="toggles lib-folders" hidden></div>
      <aside id="lib-graph" class="results-graph lib-graph" hidden>
        <div class="rg-sticky">
          <p id="lg-note" class="map-note"></p>
          <div id="lg" class="map"></div>
          <div id="lg-card" class="map-card" hidden></div>
        </div>
      </aside>
      <details id="lg-related-box" class="sample lib-related" open hidden>
        <summary>similar papers you haven't rated <span id="lg-related-count"></span></summary>
        <ol id="lg-related" class="papers"></ol>
      </details>
      <ol id="library" class="papers"></ol>
    </section>

    <section id="view-map" hidden>
      <p id="map-note" class="map-note"></p>
      <div id="map" class="map"></div>
      <div id="map-card" class="map-card" hidden></div>
    </section>
  </main>

  <footer id="foot"></footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
