<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The similarity map in miniature: one focus paper, its neighbours, their links. -->
  <rect width="32" height="32" rx="7" fill="#000"/>
  <g stroke="#55544f" stroke-width="1.2" stroke-linecap="round">
    <line x1="15" y1="16" x2="8" y2="9"/>
    <line x1="15" y1="16" x2="24" y2="10"/>
    <line x1="15" y1="16" x2="9.5" y2="24"/>
    <line x1="15" y1="16" x2="23.5" y2="22.5"/>
    <line x1="24" y1="10" x2="23.5" y2="22.5"/>
  </g>
  <circle cx="8" cy="9" r="1.8" fill="#8b8a84"/>
  <circle cx="24" cy="10" r="2" fill="#c4c3bd"/>
  <circle cx="9.5" cy="24" r="1.8" fill="#8b8a84"/>
  <circle cx="23.5" cy="22.5" r="1.8" fill="#c4c3bd"/>
  <circle cx="15" cy="16" r="2.7" fill="#ecebe6"/>
</svg>
