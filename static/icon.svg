<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The similarity map in miniature: one focus paper, its neighbours, their links. -->
  <rect width="32" height="32" rx="7" fill="#000"/>
  <g stroke="#55544f" stroke-width="1.6" stroke-linecap="round">
    <line x1="14" y1="15" x2="7" y2="8"/>
    <line x1="14" y1="15" x2="24" y2="9"/>
    <line x1="14" y1="15" x2="9" y2="25"/>
    <line x1="14" y1="15" x2="24" y2="23"/>
    <line x1="24" y1="9" x2="24" y2="23"/>
    <line x1="7" y1="8" x2="24" y2="9"/>
  </g>
  <circle cx="7" cy="8" r="2.6" fill="#8b8a84"/>
  <circle cx="24" cy="9" r="3" fill="#c4c3bd"/>
  <circle cx="9" cy="25" r="2.6" fill="#8b8a84"/>
  <circle cx="24" cy="23" r="2.6" fill="#c4c3bd"/>
  <circle cx="14" cy="15" r="4.6" fill="#ecebe6"/>
</svg>
